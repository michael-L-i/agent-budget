[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-budget"
version = "0.1.0"
description = "Plain-English usage and time budgets for Claude Code and Codex CLI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Michael Li"}]
dependencies = ["psutil>=7.0,<8"]

[project.scripts]
agent-budget = "agent_budget.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["agent_budget"]
